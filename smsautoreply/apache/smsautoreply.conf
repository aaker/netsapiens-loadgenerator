# ---------------------------------------------------------------------------
# smsautoreply - Bandwidth.com inbound SMS/MMS webhook
#
# Install:
#   Debian/Ubuntu:  cp apache/smsautoreply.conf /etc/apache2/sites-available/
#                   a2enmod proxy proxy_http headers ssl rewrite
#                   a2ensite smsautoreply && systemctl reload apache2
#   RHEL/CentOS:    cp apache/smsautoreply.conf /etc/httpd/conf.d/
#                   systemctl reload httpd
#
# The Node service listens on 127.0.0.1:3010 (PORT / BIND_ADDRESS in .env).
# Bandwidth requires HTTPS with a publicly trusted certificate for callbacks,
# so the plain :80 vhost only answers ACME and redirects everything else.
# ---------------------------------------------------------------------------

<VirtualHost *:80>
    ServerName sms.example.com

    # Let certbot renew in place.
    Alias /.well-known/acme-challenge /var/www/html/.well-known/acme-challenge
    <Directory /var/www/html/.well-known/acme-challenge>
        Require all granted
    </Directory>

    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog  ${APACHE_LOG_DIR}/smsautoreply-error.log
    CustomLog ${APACHE_LOG_DIR}/smsautoreply-access.log combined
</VirtualHost>

<VirtualHost *:443>
    ServerName sms.example.com

    SSLEngine on
    SSLCertificateFile    /etc/letsencrypt/live/sms.example.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/sms.example.com/privkey.pem
    SSLProtocol           -all +TLSv1.2 +TLSv1.3

    ProxyPreserveHost On
    ProxyRequests Off
    # Fail fast rather than holding Bandwidth's callback open.
    ProxyTimeout 15

    # Pass the client address through so the app can log/allow-list it.
    RequestHeader set X-Forwarded-Proto "https"
    RequestHeader set X-Forwarded-Port  "443"

    # --- Bandwidth inbound message callback ---------------------------------
    <Location /webhooks/bandwidth/inbound>
        ProxyPass        http://127.0.0.1:3010/webhooks/bandwidth/inbound
        ProxyPassReverse http://127.0.0.1:3010/webhooks/bandwidth/inbound

        # Basic auth, if used, is verified by the Node app (WEBHOOK_USERNAME /
        # WEBHOOK_PASSWORD), so Apache must forward the header.
        <IfModule mod_setenvif.c>
            SetEnvIf Authorization "(.*)" HTTP_AUTHORIZATION=$1
        </IfModule>

        # Optional defence in depth: restrict to Bandwidth's callback source
        # ranges. Confirm the current list with Bandwidth support before
        # enabling - an out-of-date list silently drops inbound messages.
        #<RequireAll>
        #    Require ip 67.231.0.0/16
        #    Require ip 216.82.224.0/19
        #</RequireAll>
        Require all granted
    </Location>

    # --- Delivery status callback (optional) --------------------------------
    <Location /webhooks/bandwidth/inbound/status>
        ProxyPass        http://127.0.0.1:3010/webhooks/bandwidth/inbound/status
        ProxyPassReverse http://127.0.0.1:3010/webhooks/bandwidth/inbound/status
        Require all granted
    </Location>

    # --- Health check, local monitoring only --------------------------------
    <Location /health>
        ProxyPass        http://127.0.0.1:3010/health
        ProxyPassReverse http://127.0.0.1:3010/health
        <RequireAll>
            Require ip 127.0.0.1
            Require ip ::1
        </RequireAll>
    </Location>

    # Nothing else on this vhost is proxied.
    ProxyPass / !

    ErrorLog  ${APACHE_LOG_DIR}/smsautoreply-ssl-error.log
    CustomLog ${APACHE_LOG_DIR}/smsautoreply-ssl-access.log combined
</VirtualHost>
